<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>유튜브 채널 피드 - AI Code King & Fahd Mirza</title>
	<style>
		* { margin: 0; padding: 0; box-sizing: border-box; }
		body { font-family: "Apple SD Gothic Neo", "Noto Sans Korean", sans-serif; background: #0f0f23; color: #e4e6ed; line-height: 1.6; }
		.container { max-width: 900px; margin: 0 auto; padding: 20px; }
		.header { text-align: center; padding: 60px 20px 40px; }
		.header h1 { font-size: 32px; font-weight: 800; background: linear-gradient(90deg, #ff6b35, #f7931e); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; }
		.header p { color: #7d7d98; font-size: 14px; }
		.channel-section { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); border-radius: 16px; padding: 24px; margin-bottom: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.3); overflow: hidden; }
		.channel-section h2 { font-size: 16px; font-weight: 700; color: #f7931e; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
		.channel-top { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
		.channel-avatar { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; border: 2px solid #f7931e; }
		.channel-info h3 { font-size: 17px; font-weight: 700; color: #fff; margin-bottom: 3px; }
		.channel-stats { font-size: 12px; color: #aaa; }
		.channel-stats span { color: #f7931e; font-weight: 600; }
		.feed-list { display: flex; flex-direction: column; gap: 10px; }
		.feed-item { display: flex; align-items: flex-start; gap: 12px; padding: 14px; background: rgba(255,255,255,0.03); border-radius: 12px; transition: all 0.2s; border: 1px solid transparent; text-decoration: none; }
		.feed-item:hover { background: rgba(247,147,30,0.1); border-color: rgba(247,147,30,0.3); }
		.feed-thumbnail { width: 140px; height: 80px; border-radius: 8px; background: #2a2a4a; object-fit: cover; flex-shrink: 0; }
		.feed-content { flex: 1; min-width: 0; }
		.feed-title { font-size: 15px; font-weight: 600; color: #e4e6ed; margin-bottom: 6px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
		.feed-item:hover .feed-title { color: #f7931e; }
		.feed-meta { font-size: 12px; color: #6e6e8a; display: flex; align-items: center; gap: 8px; }
		.badge-subscribe { background: #f7931e; color: #fff; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; margin-bottom: 8px; display: inline-block; }
		.empty-state { padding: 20px; text-align: center; color: #6e6e8a; font-size: 14px; font-style: italic; }
		.loading { padding: 30px; text-align: center; color: #6e6e8a; font-size: 14px; }
		.meta-bar { background: #1a1a2e; border-radius: 12px; padding: 16px; margin-bottom: 16px; font-size: 12px; color: #888; }
		.error-state { padding: 20px; text-align: center; color: #ff6b6b; font-size: 14px; }
	</style>
</head>
<body>
	<div class="container">
		<header class="header">
			<h1>✅ YouTube Channel Feeds</h1>
			<p>RSS 기반 최신 영상 자동 추적 — API Key 불필요</p>
		</header>

		<!-- AI Code King -->
		<div class="channel-section" id="section-ai-code-king">
			<h2>🎬 AI Code King</h2>
			<div class="channel-top">
				<img class="channel-avatar" id="avatar-ak" alt="AI Code King" src="https://yt3.googleusercontent.com/nV61H0crb2n8eLYtWF2EkYksD6AVInPAtC6aNxWwX2dhTpnHWcTEgnEmmrNSvd0NMj-eChQu=s160-c-k-c0x00ffffff-no-rj">
				<div class="channel-info">
					<h3><span class="badge-subscribe">AI Code King</span></h3>
					<span class="channel-stats" id="stat-ak">RSS Feed 연결 중...</span>
				</div>
			</div>
			<div class="feed-list" id="feed-ak"><div class="loading">⏳ 불러오는 중...</div></div>
		</div>

		<!-- Fahd Mirza -->
		<div class="channel-section" id="section-fahd-mirza">
			<h2>🤖 Fahd Mirza (AiDroid Studio)</h2>
			<div class="channel-top">
				<img class="channel-avatar" id="avatar-fm" alt="Fahd Mirza" src="https://yt3.googleusercontent.com/J3-Aidj_-1f90ZU53gXJOE06A6jXBp41FJX16pLEyY1lApFkSWIOilI--QVDoVZGIcHDFfJcVw=s160-c-k-c0x00ffffff-no-rj">
				<div class="channel-info">
					<h3><span class="badge-subscribe">Fahd Mirza</span></h3>
					<span class="channel-stats" id="stat-fm">RSS Feed 연결 중...</span>
				</div>
			</div>
			<div class="feed-list" id="feed-fm"><div class="loading">⏳ 불러오는 중...</div></div>
		</div>
	</div>

	<script>
		const CHANNELS = [
			{ name: "AI Code King", id: "UC0m81bQuthaQZmFbXEY9QSw", feedId: "ak" },
			{ name: "Fahd Mirza", id: "UCPix8N6PMRI4KzgyjuZeF0g", feedId: "fm" }
		];

		// YouTube RSS Feed → rss2json 프록시 (CORS 우회)
		async function fetchFeed(channel) {
			const rssUrl = `https://www.youtube.com/feeds/videos.xml?channel_id=${channel.id}`;
			const proxyUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;

			const resp = await fetch(proxyUrl);
			const data = await resp.json();

			if (data.status !== "ok") {
				throw new Error(data.message || "Feed fetch failed");
			}

			// 채널 아바타 설정
			const avatar = data.feed.image || `https://yt3.googleusercontent.com/ytc/${channel.id}=s176-c-k-c0x00ffffff-no-rj`;
			const avatarEl = document.getElementById(`avatar-${channel.feedId}`);
			if (avatarEl) avatarEl.src = avatar;

			// 통계 표시
			const statEl = document.getElementById(`stat-${channel.feedId}`);
			if (statEl) statEl.textContent = `${data.items.length}개의 영상 | ${data.feed.title}`;

			return data.items.map(item => {
				// rss2json에서 videoId 추출
				const videoId = item.guid?.replace("yt:video:", "") || item.link?.match(/v=([^&]+)/)?.[1] || "";
				// 썸네일: rss2json은 thumbnail 필드 제공, 없으면 기본 URL
				const thumbnail = item.thumbnail || (videoId ? `https://i2.ytimg.com/vi/${videoId}/hqdefault.jpg` : "");
				return {
					id: videoId,
					title: item.title,
					description: item.description?.substring(0, 120) || "",
					thumbnailUrl: thumbnail,
					publishedAt: item.pubDate,
					author: item.author,
					link: item.link
				};
			});
		}

		function timeAgo(iso) {
			const now = new Date();
			const d = new Date(iso);
			const diffMs = now - d;
			const diffMin = Math.floor(diffMs / 60000);
			const diffHour = Math.floor(diffMin / 60);
			const diffDay = Math.floor(diffHour / 24);

			if (diffMin < 60) return diffMin + "분 전";
			if (diffHour < 24) return diffHour + "시간 전";
			if (diffDay < 7) return diffDay + "일 전";
			if (diffDay < 30) return Math.floor(diffDay / 7) + "주 전";
			return Math.floor(diffDay / 30) + "개월 전";
		}

		function escapeHtml(s) {
			return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
		}

		function render(videos, feedId) {
			const el = document.getElementById(`feed-${feedId}`);
			if (!videos || videos.length === 0) {
				el.innerHTML = "<div class='empty-state'>영상을 불러올 수 없습니다. 😊</div>";
				return;
			}
			el.innerHTML = videos.slice(0, 20).map(v => `
				<a href="${escapeHtml(v.link || `https://www.youtube.com/watch?v=${v.id}`)}" target="_blank" rel="noopener" class="feed-item">
					<img class="feed-thumbnail" src="${escapeHtml(v.thumbnailUrl)}" alt="" loading="lazy">
					<div class="feed-content">
						<div class="feed-title">${escapeHtml(v.title)}</div>
						<div class="feed-meta">
							<span>📅 ${timeAgo(v.publishedAt)}</span>
							<span>👁️ ${escapeHtml(v.author || "")}</span>
						</div>
					</div>
				</a>
			`).join("");
		}

		function renderError(feedId, msg) {
			const el = document.getElementById(`feed-${feedId}`);
			el.innerHTML = `<div class="error-state">❌ ${escapeHtml(msg)}</div>`;
		}

		async function init() {
			for (const ch of CHANNELS) {
				try {
					const videos = await fetchFeed(ch);
					render(videos, ch.feedId);
				} catch (err) {
					console.error(`${ch.name} feed error:`, err);
					renderError(ch.feedId, `${ch.name} 피드 로드 실패: ${err.message}`);
				}
			}
		}

		init();
	</script>
</body>
</html>
